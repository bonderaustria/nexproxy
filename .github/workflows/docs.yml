name: Website

# Baut die VitePress-Site (Landingpage + Doku) und veroeffentlicht sie auf
# GitHub Pages. Ersetzt das alte scripts/docs-upload, das per s3cmd in einen
# S3-Bucket des Ursprungsprojekts geladen hat.
on:
  push:
    # Beide Namen: auf GitHub heisst der Standard-Branch main, im Gitea-Spiegel
    # master. Ohne den passenden Namen laeuft der Workflow nie an.
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Erlaubt das Veroeffentlichen von Hand, ohne dass sich etwas geaendert hat.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veroeffentlichungen nicht abbrechen: eine halb hochgeladene Seite
# waere schlimmer als eine, die eine Minute aelter ist.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Vollstaendige Historie, damit VitePress die Zeitstempel der letzten
          # Aenderung je Seite ermitteln kann.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhaengigkeiten installieren
        working-directory: docs
        run: npm install --no-audit --no-fund

      - name: Site bauen
        working-directory: docs
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
