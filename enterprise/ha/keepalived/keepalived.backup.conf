# keepalived-Konfiguration fuer NODE B (BACKUP, niedrigere Prioritaet)
# Ort auf dem Host: /etc/keepalived/keepalived.conf
#
# Rolle: uebernimmt die VIP nur, wenn Node A ausfaellt (keine Heartbeats mehr)
# oder dessen NPM nicht mehr ausliefert.

global_defs {
    router_id NPM_NODE_B
    enable_script_security
    script_user root
}

vrrp_script chk_npm {
    script "/etc/keepalived/check_npm.sh"
    interval 2
    timeout 3
    fall 2
    rise 2
    weight -60
}

vrrp_instance NPM_VIP {
    state BACKUP
    interface eth0                 # <-- an dein Netz-Interface anpassen
    virtual_router_id 51           # identisch zu Node A
    priority 100                   # niedriger als MASTER (150)
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_16CHAR # identisch zu Node A
    }

    virtual_ipaddress {
        192.168.20.200/24          # dieselbe VIP wie Node A
    }

    track_script {
        chk_npm
    }
}
