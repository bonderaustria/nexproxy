# keepalived-Konfiguration fuer NODE A (MASTER, hoehere Prioritaet)
# Ort auf dem Host: /etc/keepalived/keepalived.conf
#
# Rolle: haelt normalerweise die Floating-IP (VIP). Faellt NPM aus oder stirbt
# der Node, sinkt die Prioritaet / stoppen die VRRP-Heartbeats -> Node B uebernimmt.

global_defs {
    router_id NPM_NODE_A
    enable_script_security
    script_user root
}

# Health-Check: liefert NPM wirklich aus? (siehe check_npm.sh)
vrrp_script chk_npm {
    script "/etc/keepalived/check_npm.sh"
    interval 2        # alle 2 Sekunden pruefen
    timeout 3
    fall 2            # 2x hintereinander fail -> als DOWN werten
    rise 2            # 2x hintereinander ok  -> wieder UP
    weight -60        # bei DOWN Prioritaet um 60 senken -> unter Node B (100)
}

vrrp_instance NPM_VIP {
    state MASTER
    interface eth0                 # <-- an dein Netz-Interface anpassen
    virtual_router_id 51           # muss auf BEIDEN Nodes identisch sein
    priority 150                   # MASTER > BACKUP
    advert_int 1                   # Heartbeat-Intervall (Sekunden)

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_16CHAR # muss auf beiden Nodes gleich sein
    }

    virtual_ipaddress {
        192.168.20.200/24          # <-- die Floating-IP (VIP)
    }

    track_script {
        chk_npm
    }
}
