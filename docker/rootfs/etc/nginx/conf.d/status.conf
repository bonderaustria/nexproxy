# Traffic counters for the dashboard.
#
# stub_status reports active connections and cumulative counters for accepted,
# handled and total requests. Two readings a second apart give an exact requests
# per second figure — far cheaper and more accurate than parsing access logs,
# and it keeps working under load where log parsing would fall behind.
#
# Bound to the loopback interface and additionally restricted by allow/deny:
# the numbers reveal how busy an installation is, which is nobody else's
# business. Only the backend on the same container reads this.
server {
	listen 127.0.0.1:9081;
	server_name nexproxy-status;
	access_log off;

	location = /stub_status {
		stub_status;
		allow 127.0.0.1;
		deny all;
	}

	location / {
		return 404;
	}
}
