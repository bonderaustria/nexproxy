# Admin Interface
server {
	listen 81 default;
	listen [::]:81 default;

	server_name nexproxy;
	root /app/frontend;
	access_log /dev/null;

	# Bundle filenames carry a content hash, so they may be cached forever — a new
	# build produces new names and the old files are simply never requested again.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# index.html must NOT be cached: it is the file that points at the hashed
	# bundles. Without an explicit header browsers fall back to heuristic caching
	# and keep serving the old index.html, which then loads the old bundle. That
	# is why a hard reload was needed to see a new version.
	location = /index.html {
		add_header Cache-Control "no-cache, must-revalidate";
		try_files $uri =404;
	}

	location /api {
		return 302 /api/;
	}

	location /api/ {
		add_header            X-Served-By $host;
		proxy_set_header Host $host;
		proxy_set_header      X-Forwarded-Scheme $scheme;
		proxy_set_header      X-Forwarded-Proto  $scheme;
		proxy_set_header      X-Forwarded-For    $remote_addr;
		proxy_pass            http://127.0.0.1:3000/;

		proxy_read_timeout 15m;
		proxy_send_timeout 15m;
	}

	location / {
		index index.html;
		# Deep links such as /nginx/proxy are answered with index.html through the
		# fallback below, which never touches the exact-match location above — so
		# the header has to be repeated here.
		add_header Cache-Control "no-cache, must-revalidate";
		if ($request_uri ~ ^/(.*)\.html$) {
			return 302 /$1;
		}
		try_files $uri $uri.html $uri/ /index.html;
	}
}
