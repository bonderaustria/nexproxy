# ------------------------------------------------------------
# Upstream {{ id }}: {{ name }} ({{ method }})
# ------------------------------------------------------------

upstream upstream_{{ id }} {
{% if method == "least_conn" -%}
  least_conn;
{% endif -%}
{% for server in servers -%}
  server {{ server.host }}:{{ server.port }} weight={{ server.weight }}{% if server.down %} down{% endif %};
{% endfor -%}
}
